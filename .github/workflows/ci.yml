name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The Postgres service below, with the same credentials as
  # docker-compose.yml. Integration tests use a separate fandan_test
  # database that vitest's global setup creates and migrates (see
  # vitest.config.ts). e2e is not run in CI yet — see docs/ROADMAP.md M3.
  DATABASE_URL: "postgresql://fandan:fandan@localhost:5432/fandan"

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fandan
          POSTGRES_PASSWORD: fandan
          POSTGRES_DB: fandan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fandan -d fandan"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the migration check can diff against main.
          fetch-depth: 0

      - uses: pnpm/setup@v3
        with:
          runtime: node@24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check layer boundaries
        run: pnpm run check:boundaries

      - name: Committed migrations are never edited
        run: |
          # Drizzle does not re-check applied files, so an edited migration
          # would silently diverge from every database that already ran it.
          base=$(git merge-base origin/main HEAD)
          changed=$(git diff --name-only --diff-filter=MDR "$base" HEAD -- 'src/server/db/migrations/*.sql')
          if [ -n "$changed" ]; then
            echo "::error::Committed migrations were modified, renamed or deleted. Add a new migration instead."
            echo "$changed"
            exit 1
          fi

      - name: Apply migrations
        run: pnpm run db:migrate

      - name: Seed twice (the seed must stay repeatable)
        run: pnpm run db:seed && pnpm run db:seed

      - name: Check the schema matches the migrations
        run: |
          pnpm run db:generate
          if [ -n "$(git status --porcelain src/server/db/migrations)" ]; then
            echo "::error::The Drizzle schema changed without a migration. Run pnpm run db:generate and commit the result."
            git status --porcelain src/server/db/migrations
            exit 1
          fi

      - name: Unit and integration tests with coverage thresholds
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build
